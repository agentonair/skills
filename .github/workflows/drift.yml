name: Check skills match agentonair.com

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the Claude Code plugin and Gemini CLI extension manifests agree
        run: python3 scripts/check_manifests.py
      - name: Compare skills/ with the live discovery index
        run: python3 scripts/sync_from_site.py --check
